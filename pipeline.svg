<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <!-- Background -->
  <rect width="850" height="120" rx="8" fill="#000000" />

  <!-- Defs for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3f3f46" />
    </marker>
  </defs>

  <!-- Node A: Fontes de Dados -->
  <rect x="15" y="20" width="130" height="80" rx="6" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1.5" />
  <text x="80" y="52" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">Fontes de Dados</text>
  <text x="80" y="74" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#71717a" text-anchor="middle">SQL · Postgres · APIs</text>

  <!-- Connector A -> B -->
  <line x1="145" y1="60" x2="185" y2="60" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="146" y="48" width="38" height="18" rx="3" fill="#0a0a0a" stroke="#27272a" stroke-width="1" />
  <text x="165" y="61" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">extract</text>

  <!-- Node B: ETL & Transformação -->
  <rect x="190" y="20" width="145" height="80" rx="6" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1.5" />
  <text x="262.5" y="52" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">ETL &amp; Transformação</text>
  <text x="262.5" y="74" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Python · Power Query · SQL</text>

  <!-- Connector B -> C -->
  <line x1="335" y1="60" x2="375" y2="60" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="336" y="48" width="38" height="18" rx="3" fill="#0a0a0a" stroke="#27272a" stroke-width="1" />
  <text x="355" y="61" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">transform</text>

  <!-- Node C: Modelagem -->
  <rect x="380" y="20" width="135" height="80" rx="6" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1.5" />
  <text x="447.5" y="52" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">Modelagem</text>
  <text x="447.5" y="74" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Star Schema · DAX</text>

  <!-- Connector C -> D -->
  <line x1="515" y1="60" x2="555" y2="60" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="516" y="48" width="38" height="18" rx="3" fill="#0a0a0a" stroke="#27272a" stroke-width="1" />
  <text x="535" y="61" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">visualize</text>

  <!-- Node D: Dashboards -->
  <rect x="560" y="20" width="135" height="80" rx="6" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1.5" />
  <text x="627.5" y="52" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">Dashboards</text>
  <text x="627.5" y="74" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Power BI · Excel · Tableau</text>

  <!-- Connector D -> E -->
  <line x1="695" y1="60" x2="735" y2="60" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="698" y="48" width="34" height="18" rx="3" fill="#0a0a0a" stroke="#27272a" stroke-width="1" />
  <text x="715" y="61" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">act</text>

  <!-- Node E: Decisão -->
  <rect x="740" y="20" width="95" height="80" rx="6" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1.5" />
  <text x="787.5" y="52" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" text-anchor="middle">Decisão</text>
  <text x="787.5" y="74" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#71717a" text-anchor="middle">KPIs · Insights</text>
</svg>
